# Infrastructure services for TraceForge. Works with both `docker compose` and `podman compose`. See AGENTS.md for details.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot
      POSTGRES_DB: devpilot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
